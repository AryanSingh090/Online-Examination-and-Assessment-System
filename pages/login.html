<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - ExamPro</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1 class="page-title">Login Portal</h1>
        <form class="form-box" id="loginForm" data-dashboard-prefix="" novalidate>
          <div class="input-group">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="student@example.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="input-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter password"
              autocomplete="current-password"
              minlength="6"
              required
            />
          </div>
          <div class="input-group">
            <label for="role">Role</label>
            <select id="role" name="role" required>
              <option value="" disabled selected>Select your role</option>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
            </select>
          </div>
          <p id="login-note" role="note">Demo only: account credentials are not authenticated.</p>
          <p id="message" role="alert" aria-live="polite"></p>
          <div class="cta-group">
            <button type="submit" class="btn btn-primary">Login</button>
            <a href="../index.html" class="btn btn-secondary">Back Home</a>
          </div>
        </form>
        <p>Demo links:</p>
        <a class="btn btn-secondary" href="student-dashboard.html">Student Dashboard</a>
        <a class="btn btn-secondary" href="teacher-dashboard.html">Teacher Dashboard</a>
      </div>
    </div>
    <script src="../js/login.js"></script>
  </body>
</html>
