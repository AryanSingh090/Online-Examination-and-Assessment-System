<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam Page</title>
    <link rel="stylesheet" href="../style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card exam-card">
        <h1 class="page-title">Web Development Quiz</h1>

        <div class="question">
          <h3>1. Which HTML tag is used to define a table?</h3>
          <div class="options">
            <label class="option"><input type="radio" name="q1" /> &lt;table&gt;</label>
            <label class="option"><input type="radio" name="q1" /> &lt;div&gt;</label>
            <label class="option"><input type="radio" name="q1" /> &lt;section&gt;</label>
            <label class="option"><input type="radio" name="q1" /> &lt;form&gt;</label>
          </div>
        </div>

        <div class="question">
          <h3>2. Which CSS property controls text size?</h3>
          <div class="options">
            <label class="option"><input type="radio" name="q2" /> font-size</label>
            <label class="option"><input type="radio" name="q2" /> text-align</label>
            <label class="option"><input type="radio" name="q2" /> padding</label>
            <label class="option"><input type="radio" name="q2" /> border</label>
          </div>
        </div>

        <div class="question">
          <h3>3. What is JavaScript mainly used for?</h3>
          <div class="options">
            <label class="option"><input type="radio" name="q3" /> Styling</label>
            <label class="option"><input type="radio" name="q3" /> Structure</label>
            <label class="option"><input type="radio" name="q3" /> Interaction and logic</label>
            <label class="option"><input type="radio" name="q3" /> Database setup</label>
          </div>
        </div>

        <div class="question">
          <h3>4. Which CSS property creates spacing inside an element?</h3>
          <div class="options">
            <label class="option"><input type="radio" name="q4" /> margin</label>
            <label class="option"><input type="radio" name="q4" /> padding</label>
            <label class="option"><input type="radio" name="q4" /> border-radius</label>
            <label class="option"><input type="radio" name="q4" /> display</label>
          </div>
        </div>

        <a href="result.html" class="btn btn-primary">Submit Exam</a>
      </div>
    </div>
  </body>
</html>
