<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Development Quiz</title>
    <link rel="stylesheet" href="../style.css" />
    <script src="../js/exam.js" defer></script>
  </head>
  <body>
    <div class="page-shell">
      <header class="exam-heading">
        <div>
          <p class="eyebrow">Online examination</p>
          <h1 class="page-title">Web Development Quiz</h1>
        </div>
        <p class="exam-instructions">Choose one answer for each question. You can mark questions for review before finishing.</p>
      </header>
      <div class="exam-layout">
        <main id="exam-questions" class="exam-card" aria-label="Exam questions"></main>
        <aside class="question-sidebar card" aria-label="Question status">
          <h2>Questions</h2>
          <p id="attempted-count" class="attempted-count" aria-live="polite">0 of 0 attempted</p>
          <div class="question-legend">
            <span><i class="legend-dot attempted"></i> Attempted</span>
            <span><i class="legend-dot review"></i> Marked for review</span>
          </div>
          <nav id="question-navigation" class="question-navigation" aria-label="Jump to question"></nav>
          <button id="finish-exam" class="btn btn-primary finish-button" type="button">Finish Exam</button>
        </aside>
      </div>
    </div>
  </body>
</html>
