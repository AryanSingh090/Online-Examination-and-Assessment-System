<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1 class="page-title">Student Dashboard</h1>
        <div class="dashboard-grid">
          <div class="metric">
            <h3>Available Exams</h3>
            <p>05</p>
          </div>
          <div class="metric">
            <h3>Completed</h3>
            <p>03</p>
          </div>
          <div class="metric">
            <h3>Average Score</h3>
            <p>87%</p>
          </div>
          <div class="metric">
            <h3>Rank</h3>
            <p>#12</p>
          </div>
        </div>

        <div class="cta-group">
          <a href="exam.html" class="btn btn-primary">Start Exam</a>
          <a href="result.html" class="btn btn-secondary">View Result</a>
        </div>
      </div>
    </div>
  </body>
</html>
