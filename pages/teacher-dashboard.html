<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="card">
        <h1 class="page-title">Teacher Dashboard</h1>
        <div class="dashboard-grid">
          <div class="metric">
            <h3>Active Tests</h3>
            <p>08</p>
          </div>
          <div class="metric">
            <h3>Students</h3>
            <p>320</p>
          </div>
          <div class="metric">
            <h3>Pending Review</h3>
            <p>12</p>
          </div>
          <div class="metric">
            <h3>Average Score</h3>
            <p>83%</p>
          </div>
        </div>

        <div class="cta-group">
          <a href="exam.html" class="btn btn-primary">Create Exam</a>
          <a href="result.html" class="btn btn-secondary">Manage Results</a>
        </div>
      </div>
    </div>
  </body>
</html>
